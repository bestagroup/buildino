name: Refresh Composer Lock

on:
  push:
    branches:
      - finalization/no-iot-2026-10-03

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Refresh security-sensitive dependency lock
        run: >
          composer update laravel/framework league/commonmark league/flysystem
          --with-all-dependencies
          --no-install
          --no-scripts
          --no-interaction
          --prefer-dist

      - name: Audit refreshed lock
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Upload composer.lock
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-composer-lock
          path: composer.lock
          if-no-files-found: error
