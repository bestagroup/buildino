name: Refresh Composer Lock

on:
  push:
    branches:
      - finalization/no-iot-2026-10-03

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Refresh security-sensitive dependency lock
        run: >
          composer update laravel/framework league/commonmark league/flysystem
          --with-all-dependencies
          --no-install
          --no-scripts
          --no-interaction
          --prefer-dist

      - name: Audit refreshed lock
        run: composer audit --locked --no-interaction --abandoned=report

      - name: Commit refreshed composer.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock is already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh security-sensitive dependencies"
          git push origin HEAD:finalization/no-iot-2026-10-03
