name: Refresh NPM Lock

on:
  push:
    branches:
      - finalization/no-iot-2026-10-03

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Refresh package lock and remediate audited runtime dependency
        run: npm install axios@latest --save --package-lock-only --ignore-scripts

      - name: Validate clean install
        run: npm ci --ignore-scripts

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Commit refreshed frontend dependency manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh npm lock"
          git push origin HEAD:finalization/no-iot-2026-10-03
